[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentforge"
version = "0.5.1"
description = "Multi-agent software engineering harness with sandboxed execution and human approval"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Yash Shah", email = "yash376351@gmail.com" }]
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "httpx>=0.27",
    "platformkit>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/yashshah9/agentforge"
Repository = "https://github.com/yashshah9/agentforge"
Issues = "https://github.com/yashshah9/agentforge/issues"

[project.optional-dependencies]
sandbox = ["agentbox-sandbox>=0.6.0"]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.9",
    "platformkit[dev]",
]

[project.scripts]
agentforge = "agentforge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentforge"]

[tool.hatch.build.targets.wheel.force-include]
"src/agentforge/evals/data/baseline.json" = "agentforge/evals/data/baseline.json"

[tool.uv.sources]
platformkit = { path = "../platformkit", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["agentforge"]
